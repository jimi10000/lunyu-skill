name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 版本一致性校验（SKILL.md 顶层 / metadata / README 徽章 / CHANGELOG 顶部）
        run: python scripts/check_version.py

      - name: 打包清单双向校验（正向引用齐全 + 反向文件有归属）
        run: python scripts/pack_check.py

      - name: 全部脚本 --help 必须返回 0
        run: |
          set -e
          for f in scripts/*.py; do
            echo "== $f =="
            python "$f" --help >/dev/null
          done

      - name: 单元测试（仓库 tests/，不进技能包）
        run: python tests/run_tests.py

      - name: 试打包（验证 pack.py 在打包前自动跑 pack_check + check_version）
        run: python scripts/pack.py --out /tmp/lunyu-ci
